<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelPhrase</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1c35;
    --panel-border: #2d2f55;
    --accent: #7c6cff;
    --accent2: #4ad9d9;
    --text: #e9e9f7;
    --muted: #9a9bc0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% -10%, #2a1f55 0%, var(--bg) 55%);
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 {
    font-size: 2.4rem;
    margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  header p { color: var(--muted); margin: 8px 0 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .drop {
    border: 2px dashed var(--panel-border);
    border-radius: 12px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .drop.drag { border-color: var(--accent); background: rgba(124,108,255,0.08); }
  .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop img { max-height: 160px; border-radius: 8px; margin-top: 10px; }
  .drop .hint { color: var(--muted); font-size: .9rem; }

  label.field-label { display: block; margin: 18px 0 6px; color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .5px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: #10112080;
    color: var(--text);
    font-size: 1rem;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  button#go {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #0f1020;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    cursor: pointer;
    transition: transform .1s, opacity .15s;
  }
  button#go:hover { transform: translateY(-1px); }
  button#go:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .captions { margin-top: 18px; font-size: .95rem; }
  .captions div { margin: 4px 0; }
  .captions .label { color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .tile {
    background: #10112080;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .12s;
  }
  .tile:hover { transform: translateY(-3px); }
  .tile img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .tile .meta { padding: 8px 10px; font-size: .78rem; color: var(--muted); }
  .tile .score { color: var(--accent2); font-weight: 600; }

  h2 { font-size: 1.1rem; margin: 0 0 16px; color: var(--text); }
  .status { text-align: center; color: var(--muted); padding: 20px; }
  .error { color: #ff8b8b; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PixelPhrase</h1>
    <p>Caption it. Rewrite it. Find it. &mdash; training-free text-guided image retrieval</p>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <div id="dropContent">
        <div>Drop a reference image here, or click to choose one</div>
        <div class="hint">JPG / PNG</div>
      </div>
    </label>

    <label class="field-label" for="instruction">Edit instruction</label>
    <input type="text" id="instruction" placeholder="e.g. make it black and white">

    <button id="go">Find matching images</button>

    <div id="captions" class="captions"></div>
  </div>

  <div class="card">
    <h2>Top matches</h2>
    <div id="results" class="grid"><div class="status">Run a query above to see results.</div></div>
  </div>

  <div class="card">
    <h2>Gallery</h2>
    <div id="gallery" class="grid"><div class="status">Loading gallery&hellip;</div></div>
  </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const dropContent = document.getElementById('dropContent');
const goBtn = document.getElementById('go');
const captionsEl = document.getElementById('captions');
const resultsEl = document.getElementById('results');
const galleryEl = document.getElementById('gallery');

let chosenFile = null;

function showPreview(file) {
  const url = URL.createObjectURL(file);
  dropContent.innerHTML = `<img src="${url}" alt="preview"><div class="hint">${file.name}</div>`;
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) { chosenFile = fileInput.files[0]; showPreview(chosenFile); }
});

['dragenter', 'dragover'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(evt =>
  drop.addEventListener(evt, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) { chosenFile = file; fileInput.files = e.dataTransfer.files; showPreview(file); }
});

function tile(name, caption, score) {
  const scoreHtml = score !== undefined ? `<div class="score">${score}</div>` : '';
  return `<div class="tile">
      <img src="/images/${name}" alt="${caption}">
      <div class="meta">${caption}${scoreHtml}</div>
    </div>`;
}

async function loadGallery() {
  const res = await fetch('/api/gallery');
  const items = await res.json();
  galleryEl.innerHTML = items.map(i => tile(i.name, i.caption)).join('');
}

goBtn.addEventListener('click', async () => {
  const instruction = document.getElementById('instruction').value.trim();
  if (!chosenFile) { alert('Choose a reference image first.'); return; }
  if (!instruction) { alert('Type an edit instruction first.'); return; }

  goBtn.disabled = true;
  goBtn.textContent = 'Thinking… (captioning + rewriting + retrieving)';
  captionsEl.innerHTML = '';
  resultsEl.innerHTML = '<div class="status">Running the pipeline on CPU, this can take a bit&hellip;</div>';

  const form = new FormData();
  form.append('image', chosenFile);
  form.append('instruction', instruction);

  try {
    const res = await fetch('/api/query', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    captionsEl.innerHTML = `
      <div><span class="label">Base caption:</span> ${data.base_caption}</div>
      <div><span class="label">Rewritten target:</span> ${data.rewritten_caption}</div>`;
    resultsEl.innerHTML = data.results.map(r => tile(r.name, r.caption, r.score)).join('');
  } catch (err) {
    resultsEl.innerHTML = `<div class="status error">${err.message}</div>`;
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Find matching images';
  }
});

loadGallery();
</script>
</body>
</html>
